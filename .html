<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clients SQL</title>
    <style>
        #users-list { display: flex; flex-wrap: wrap; gap: 20px; }
        .user-card { border: 1px solid #ddd; padding: 10px; width: 200px; border-radius: 8px; }
    </style>
</head>
<body>
    <section>
        <h2>Clients de la base SQL</h2>
        <div id="users-list"></div>
    </section>

    <script>
        const usersList = document.getElementById('users-list');

        fetch('http://127.0.0.1:5001/api/users')
            .then(response => response.json())
            .then(users => {
                users.forEach(user => {
                    const userElement = document.createElement('div');
                    userElement.classList.add('user-card');

                    userElement.innerHTML = `
                        <h3>${user[1]}</h3>
                        <p>ID : ${user[0]}</p>
                        <p>Âge : ${user[2]}</p>
                    `;

                    usersList.appendChild(userElement);
                });
            })
            .catch(error => console.error('Erreur lors du fetch :', error));
    </script>
</body>
</html>
