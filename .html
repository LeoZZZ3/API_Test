<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clients SQL</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            min-height: 100vh;
            padding: 40px 20px;
            color: #1e293b;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.2rem;
        }

        .subtitle {
            text-align: center;
            margin-bottom: 35px;
            color: #64748b;
            font-size: 1rem;
        }

        #users-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .user-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .user-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.12);
        }

        .avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: #2563eb;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .user-name {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .user-info {
            color: #475569;
            margin-bottom: 6px;
            font-size: 0.95rem;
        }

        .empty-message,
        .loading-message,
        .error-message {
            text-align: center;
            padding: 30px;
            border-radius: 16px;
            background: white;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        .error-message {
            color: #b91c1c;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Liste des clients</h1>
        <p class="subtitle">Données récupérées depuis votre API Flask et votre base SQL</p>

        <div id="users-list">
            <div class="loading-message">Chargement des clients...</div>
        </div>
    </div>

    <script>
        const usersList = document.getElementById('users-list');

        fetch('http://127.0.0.1:5001/api/users')
            .then(response => response.json())
            .then(users => {
                usersList.innerHTML = '';

                if (users.length === 0) {
                    usersList.innerHTML = '<div class="empty-message">Aucun client trouvé.</div>';
                    return;
                }

                users.forEach(user => {
                    const userElement = document.createElement('div');
                    userElement.classList.add('user-card');

                    const firstLetter = user[1] ? user[1].charAt(0).toUpperCase() : "?";

                    userElement.innerHTML = `
                        <div class="avatar">${firstLetter}</div>
                        <div class="user-name">${user[1]}</div>
                        <div class="user-info"><strong>ID :</strong> ${user[0]}</div>
                        <div class="user-info"><strong>Âge :</strong> ${user[2]}</div>
                    `;

                    usersList.appendChild(userElement);
                });
            })
            .catch(error => {
                console.error('Erreur lors du fetch :', error);
                usersList.innerHTML = '<div class="error-message">Erreur lors du chargement des clients.</div>';
            });
    </script>
</body>
</html>
