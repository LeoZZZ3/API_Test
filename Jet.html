<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Jet Ski Manager - Léo</title>
  <style>
    :root { --primary: #007bff; --dark: #343a40; --light: #f8f9fa; }
    body { font-family: 'Segoe UI', sans-serif; background: #eaeff2; margin: 0; padding: 20px; }
    
    /* Conteneur de Cartes */
    .grid { 
        display: grid; 
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
        gap: 20px; 
        margin-top: 20px;
    }

    .card { 
        background: white; 
        border-radius: 12px; 
        padding: 20px; 
        box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        border-top: 5px solid var(--primary);
    }

    .badge {
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 0.8em;
        font-weight: bold;
        background: #d4edda; color: #155724;
    }

    .header-nav { display: flex; gap: 10px; margin-bottom: 30px; justify-content: center; }
    button { padding: 10px 20px; cursor: pointer; border: none; border-radius: 5px; background: var(--dark); color: white; }
    button:hover { background: var(--primary); }
  </style>
</head>
<body>

  <h1>Jet Ski Rental Dashboard</h1>
  
  <div class="header-nav">
    <button onclick="loadData('users')">Voir Clients</button>
    <button onclick="loadData('jetskis')">Flotte Jet Ski</button>
  </div>

  <div id="display-area" class="grid">
    </div>

  <script>
    function loadData(type) {
      const area = document.getElementById("display-area");
      area.innerHTML = "<p>Chargement...</p>";

      fetch(`http://127.0.0.1:5001/api/${type}`)
        .then(res => res.json())
        .then(data => {
          area.innerHTML = "";
          data.forEach(item => {
            if(type === 'users') area.innerHTML += renderUser(item);
            else area.innerHTML += renderJetSki(item);
          });
        });
    }

    function renderUser(u) {
      return `
        <div class="card">
          <h3>${u.prenom} ${u.nom}</h3>
          <p>${u.email}</p>
          <p>${u.telephone}</p>
          <span class="badge">${u.a_permis_bateau ? "Permis OK" : "Sans Permis"}</span>
        </div>`;
    }

    function renderJetSki(j) {
      return `
        <div class="card" style="border-top-color: #ffc107">
          <h3>${j.nom} <small>(${j.marque})</small></h3>
          <p><b>${j.puissance_cv} CV</b> - ${j.capacite_personnes} pers.</p>
          <p><i>${j.description}</i></p>
          <p>Caution : ${j.caution}€</p>
        </div>`;
    }

    // Chargement par défaut
    loadData('users');
  </script>
</body>
</html>
